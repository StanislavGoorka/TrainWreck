name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gdunit4:
    name: GdUnit4 (Godot 4.7.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.7.2'
          version: 'installed'      # use addons/gdUnit4 committed in the repo (v6.2.3)
          paths: 'res://tests'
          arguments: '-c'           # run every suite instead of stopping at the first failure
          timeout: 25
          publish-report: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          report-name: test-report.xml
